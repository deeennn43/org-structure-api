services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: org_structure
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d org_structure"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: org_structure
      DB_SSLMODE: disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      db:
        condition: service_healthy
